services:
  django:
    container_name: watchlog
    image: watchlog-django:prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on:
      - database
    environment:
      DJANGO_ENV: prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-watchlog_db}
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog_password}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    networks:
      - watchlog
      - caddy
    restart: unless-stopped

  database:
    image: pgvector/pgvector:pg18-trixie
    container_name: watchlog-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchlog_db}
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog_password}
    networks:
      - watchlog
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

networks:
  watchlog:
  caddy:
    external: true

volumes:
  postgres_data:
