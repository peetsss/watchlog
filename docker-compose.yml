services:
  django:
    container_name: watchlog
    image: watchlog-django:prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    depends_on:
      - database
      - redis
    environment:
      DJANGO_ENV: prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-watchlog_db}
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog_password}
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    networks:
      - watchlog
      - caddy
    restart: unless-stopped

  database:
    image: pgvector/pgvector:pg18-trixie
    container_name: watchlog-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchlog_db}
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchlog} -d ${POSTGRES_DB:-watchlog_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - watchlog
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: watchlog-redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - watchlog
    volumes:
      - redis_data:/data
    restart: unless-stopped

networks:
  watchlog:
  caddy:
    external: true

volumes:
  postgres_data:
  redis_data:
