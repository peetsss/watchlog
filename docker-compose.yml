x-app-environment: &app-environment
  WATCHLOG_ENV: prod
  WATCHLOG_SECRET_KEY: ${WATCHLOG_SECRET_KEY:?Set WATCHLOG_SECRET_KEY in .env}
  WATCHLOG_PUBLIC_URL: ${WATCHLOG_PUBLIC_URL:?Set WATCHLOG_PUBLIC_URL in .env}
  WATCHLOG_ALLOWED_HOSTS: ${WATCHLOG_ALLOWED_HOSTS:-localhost,127.0.0.1}
  WATCHLOG_TRUSTED_ORIGINS: ${WATCHLOG_TRUSTED_ORIGINS:-http://localhost}
  WATCHLOG_LOG_FORMAT: ${WATCHLOG_LOG_FORMAT:-json}
  WATCHLOG_DOCS_ENABLED: "false"
  WATCHLOG_DB: ${POSTGRES_DB:-watchlog_v2}
  POSTGRES_HOST: database
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-watchlog}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  WATCHLOG_REDIS_URL: redis://redis:6379/0
  WATCHLOG_CELERY_BROKER_URL: redis://redis:6379/1
  WATCHLOG_TMDB_API_KEY: ${TMDB_API_KEY:-}
  WATCHLOG_TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
  WATCHLOG_TMDB_LANGUAGE: ${WATCHLOG_TMDB_LANGUAGE:-en-US}
  WATCHLOG_DEFAULT_REGION: ${WATCHLOG_DEFAULT_REGION:-PL}
  WATCHLOG_SUPPORTED_REGIONS: ${WATCHLOG_SUPPORTED_REGIONS:-PL}
  WATCHLOG_WATCH_PROVIDER_TTL_SECONDS: ${WATCHLOG_WATCH_PROVIDER_TTL_SECONDS:-86400}
  WATCHLOG_PROVIDER_REFRESH_LIMIT: ${WATCHLOG_PROVIDER_REFRESH_LIMIT:-500}
  WATCHLOG_MAIL_BACKEND: ${WATCHLOG_MAIL_BACKEND:?Set WATCHLOG_MAIL_BACKEND=resend in .env}
  WATCHLOG_MAIL_FROM: ${WATCHLOG_MAIL_FROM:-}
  WATCHLOG_MAIL_REPLY_TO: ${WATCHLOG_MAIL_REPLY_TO:-}
  WATCHLOG_RESEND_API_KEY: ${WATCHLOG_RESEND_API_KEY:-}
  WATCHLOG_SENTRY_DSN: ${WATCHLOG_SENTRY_DSN:-}
  WATCHLOG_TRUSTED_PROXY_IPS: ${WATCHLOG_TRUSTED_PROXY_IPS:-}
  WATCHLOG_RATE_LIMIT_ENABLED: ${WATCHLOG_RATE_LIMIT_ENABLED:-true}
  WATCHLOG_REQUIRE_VERIFIED_EMAIL: ${WATCHLOG_REQUIRE_VERIFIED_EMAIL:-true}
  WATCHLOG_MAX_REQUEST_BODY_BYTES: ${WATCHLOG_MAX_REQUEST_BODY_BYTES:-1048576}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}

x-app-image: &app-image ${WATCHLOG_IMAGE:?Set WATCHLOG_IMAGE to the deployed image tag}

services:
  migrate:
    image: *app-image
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-environment
    networks:
      - watchlog
    restart: "no"

  api:
    image: *app-image
    depends_on:
      migrate:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-environment
    ports:
      # Loopback only: the host reverse proxy is the public entry point.
      - "127.0.0.1:8000:8000"
    networks:
      - watchlog
    restart: unless-stopped

  worker:
    image: *app-image
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - --max-tasks-per-child=100
    depends_on:
      migrate:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-environment
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - watchlog
    restart: unless-stopped

  beat:
    image: *app-image
    command:
      - celery
      - -A
      - app.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
      - --pidfile=/tmp/celerybeat.pid
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: *app-environment
    networks:
      - watchlog
    restart: unless-stopped

  database:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchlog_v2}
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchlog} -d ${POSTGRES_DB:-watchlog_v2}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - watchlog
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine@sha256:1273af45b299d2b8b60d0e400d90aa6c2c5b1794f01d6a7ca60ff3ba6e65efb5
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - watchlog
    volumes:
      - redis_data:/data
    restart: unless-stopped

networks:
  watchlog:

volumes:
  postgres_data:
  redis_data:
