services:
  api:
    image: watchlog:prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchlog
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WATCHLOG_ENV: prod
      WATCHLOG_SECRET_KEY: ${WATCHLOG_SECRET_KEY:?Set WATCHLOG_SECRET_KEY in .env}
      WATCHLOG_ALLOWED_HOSTS: ${WATCHLOG_ALLOWED_HOSTS:-localhost,127.0.0.1}
      WATCHLOG_TRUSTED_ORIGINS: ${WATCHLOG_TRUSTED_ORIGINS:-http://localhost:8000}
      WATCHLOG_DB: ${POSTGRES_DB:-watchlog_v2}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog_password}
      WATCHLOG_REDIS_URL: redis://redis:6379/0
      WATCHLOG_TMDB_API_KEY: ${TMDB_API_KEY:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    ports:
      - "8000:8000"
    networks:
      - watchlog
    restart: unless-stopped

  database:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchlog_v2}
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchlog} -d ${POSTGRES_DB:-watchlog_v2}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - watchlog
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - watchlog
    volumes:
      - redis_data:/data
    restart: unless-stopped

networks:
  watchlog:

volumes:
  postgres_data:
  redis_data:
