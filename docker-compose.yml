services:
  django:
    container_name: watchlog
    image: watchlog-django:prod
    build:
      context: .
      dockerfile: Dockerfile.dev
    # ASGI via Daphne (HTTP + websockets); entrypoint runs migrate/collectstatic first.
    command: daphne watchlog.asgi:application --bind 0.0.0.0 --port 8000
    depends_on:
      - database
      - redis
    environment:
      DJANGO_ENV: prod
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-watchlog_db}
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog_password}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      CHANNEL_REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: ${OLLAMA_URL:-http://100.99.131.45:11434}
    networks:
      - watchlog
      - caddy
    restart: unless-stopped

  database:
    image: pgvector/pgvector:pg18-trixie
    container_name: watchlog-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchlog_db}
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog_password}
    networks:
      - watchlog
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: watchlog-redis
    command: redis-server --appendonly yes
    networks:
      - watchlog
    volumes:
      - redis_data:/data
    restart: unless-stopped

networks:
  watchlog:
  caddy:
    external: true

volumes:
  postgres_data:
  redis_data:
