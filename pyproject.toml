[project]
name = "watchlog"
version = "0.1.0"
description = "Shared movie watchlists and lobby voting for groups"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pgvector>=0.5.1",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/watchlog/settings/*.py" = ["F403", "F405"]
"src/*/migrations/*.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

docstring-code-format = true
docstring-code-line-length = "dynamic"
