x-dev-environment: &dev-environment
  WATCHLOG_ENV: dev
  WATCHLOG_PUBLIC_URL: http://localhost:8001
  WATCHLOG_DB: watchlog_v2
  POSTGRES_HOST: database
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-watchlog}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog_password}
  WATCHLOG_REDIS_URL: redis://redis:6379/0
  WATCHLOG_CELERY_BROKER_URL: redis://redis:6379/1
  WATCHLOG_ALLOWED_HOSTS: localhost,127.0.0.1,api
  WATCHLOG_TRUSTED_ORIGINS: http://localhost:8001,http://localhost:5173
  WATCHLOG_LOG_FORMAT: text
  WATCHLOG_DOCS_ENABLED: "true"
  WATCHLOG_TMDB_API_KEY: ${TMDB_API_KEY:-}
  WATCHLOG_TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
  WATCHLOG_TMDB_LANGUAGE: en-US
  WATCHLOG_DEFAULT_REGION: PL
  WATCHLOG_SUPPORTED_REGIONS: PL
  WATCHLOG_MAIL_BACKEND: console
  WATCHLOG_MAIL_FROM: ""
  WATCHLOG_MAIL_REPLY_TO: ""
  WATCHLOG_RESEND_API_KEY: ""
  WATCHLOG_SENTRY_DSN: ""
  WATCHLOG_RATE_LIMIT_ENABLED: "false"
  WATCHLOG_REQUIRE_VERIFIED_EMAIL: "true"
  WATCHLOG_MAX_REQUEST_BODY_BYTES: "1048576"

services:
  migrate:
    image: watchlog-api:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["alembic", "upgrade", "head"]
    environment: *dev-environment
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - watchlog
    restart: "no"

  api:
    image: watchlog-api:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log --ws-max-size 65536
    ports:
      - "127.0.0.1:8001:8000"
    environment: *dev-environment
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - watchlog

  worker:
    image: watchlog-api:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - --max-tasks-per-child=100
    environment: *dev-environment
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - watchlog

  beat:
    image: watchlog-api:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command:
      - celery
      - -A
      - app.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
      - --pidfile=/tmp/celerybeat.pid
    environment: *dev-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - watchlog

  database:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchlog_v2}
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog_password}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchlog} -d ${POSTGRES_DB:-watchlog_v2}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - watchlog
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.8.4-alpine@sha256:1273af45b299d2b8b60d0e400d90aa6c2c5b1794f01d6a7ca60ff3ba6e65efb5
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - watchlog
    volumes:
      - redis_data:/data

networks:
  watchlog:

volumes:
  postgres_data:
  redis_data:
