services:
  api:
    image: watchlog-api:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    environment:
      WATCHLOG_ENV: dev
      WATCHLOG_DB: watchlog_v2
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog_password}
      WATCHLOG_REDIS_URL: redis://redis:6379/0
      WATCHLOG_ALLOWED_HOSTS: localhost,127.0.0.1,api
      WATCHLOG_TRUSTED_ORIGINS: http://localhost:8001,http://localhost:5173
      WATCHLOG_TMDB_API_KEY: ${TMDB_API_KEY:-}
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - watchlog

  database:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-watchlog_v2}
      POSTGRES_USER: ${POSTGRES_USER:-watchlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-watchlog_password}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchlog} -d ${POSTGRES_DB:-watchlog_v2}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - watchlog
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - watchlog
    volumes:
      - redis_data:/data

networks:
  watchlog:

volumes:
  postgres_data:
  redis_data:
