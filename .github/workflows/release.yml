name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the v prefix (for example 0.1.2)"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the automation token
        env:
          TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Add AUTOMATION_TOKEN with contents, issues and pull-requests write access." >&2
            exit 1
          fi
      - name: Ensure release labels exist
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          gh label create "autorelease: pending" --color FBCA04 --force --repo "$GITHUB_REPOSITORY"
          gh label create "autorelease: tagged" --color 0E8A16 --force --repo "$GITHUB_REPOSITORY"
      - name: Validate the requested version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re

          version = os.environ["INPUT_VERSION"].strip().removeprefix("v")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Invalid version: {version!r}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"RELEASE_VERSION={version}\n")
          print(f"Releasing as {version}")
          PY
      - name: Tag merged releases
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          npx --yes release-please@17.6.0 github-release \
            --repo-url "$GITHUB_REPOSITORY" \
            --target-branch dev \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json \
            --token "$GITHUB_TOKEN"
      - name: Create or update the release PR
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          npx --yes release-please@17.6.0 release-pr \
            --repo-url "$GITHUB_REPOSITORY" \
            --target-branch dev \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json \
            --release-as "$RELEASE_VERSION" \
            --token "$GITHUB_TOKEN"
