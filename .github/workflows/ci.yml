name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      database:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_DB: watchlog_test
          POSTGRES_USER: watchlog
          POSTGRES_PASSWORD: watchlog_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchlog -d watchlog_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WATCHLOG_ENV: test
      POSTGRES_DB: watchlog_test
      POSTGRES_USER: watchlog
      POSTGRES_PASSWORD: watchlog_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      WATCHLOG_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.25"
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --frozen
      - run: uv run ruff check app tests alembic scripts
      - run: uv run ruff format --check app tests alembic scripts
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t watchlog:ci .
